# Alembic 配置。
# 注意：这里不写连接串。env.py 只从环境变量 DATABASE_URL 读取（禁止口令入库）。
# 用法（在 backend 目录下执行）：
#   alembic upgrade head
#   alembic downgrade -1
#   alembic stamp 0001        # 已有 db/schema.sql 建好结构的库，先对齐基线
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s
timezone = Asia/Shanghai
