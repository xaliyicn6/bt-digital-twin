[project]
name = "bt-platform-backend"
version = "0.1.0"
description = "公路桥隧结构智能检测与数字孪生运维平台 - 后端骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pyyaml==6.0.*",
    "psycopg[binary]==3.2.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "httpx==0.27.*",
    "ruff==0.7.*",
    "mypy==1.13.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["yaml", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
