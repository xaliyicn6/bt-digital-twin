[project]
name = "bt-platform-backend"
version = "0.1.0"
description = "公路桥隧结构智能检测与数字孪生运维平台 - 后端骨架"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pyyaml==6.0.*",
    "psycopg[binary]==3.2.*",
    "sqlalchemy==2.0.*",
    "geoalchemy2==0.15.*",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "httpx==0.27.*",
    "ruff==0.7.*",
    "mypy==1.13.*",
    "alembic==1.14.*",
]

[tool.setuptools.packages.find]
# backend/ 下同时有 app/ 与 alembic/，setuptools 默认的 flat-layout 自动发现会判定为
# 多顶层包并拒绝构建。这里显式只发行 app，alembic 作为迁移脚本目录不打包。
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "var*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["yaml", "psycopg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy 未随包提供类型存根（numpy 自带存根，不放宽）
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
